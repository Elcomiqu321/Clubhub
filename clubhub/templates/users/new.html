{% extends "base.html" %}
{% from "_macros.html" import csrf %}
{% block title %}Add member{% endblock %}
{% block content %}
<h1>Add a club member</h1>
<p class="muted">A temporary password will be generated. Share it with the member so they can log in.</p>
<form method="post" class="form">
  {{ csrf() }}
  <label>Full name <input name="name" required></label>
  <label>Email <input type="email" name="email" required></label>
  <label>Phone <input type="tel" name="phone"></label>
  <button class="btn">Create member</button>
</form>
{% endblock %}
