{% extends "base.html" %}
{% from "_macros.html" import csrf %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="narrow">
  <h1>Create your account</h1>
  <form method="post" class="form">
    {{ csrf() }}
    <label>Full name <input name="name" required value="{{ request.form.name }}"></label>
    <label>Email <input type="email" name="email" required value="{{ request.form.email }}" autocomplete="email"></label>
    <label>Password <input type="password" name="password" required minlength="6" autocomplete="new-password"></label>
    <button class="btn">Register</button>
  </form>
  <p>Already registered? <a href="{{ url_for('auth.login') }}">Log in</a></p>
</div>
{% endblock %}
