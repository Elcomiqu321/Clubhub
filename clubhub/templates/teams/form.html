{% extends "base.html" %}
{% from "_macros.html" import csrf %}
{% block title %}{{ 'Edit team' if team else 'New team' }}{% endblock %}
{% block content %}
<h1>{{ 'Edit team' if team else 'New team' }}</h1>
<form method="post" class="form">
  {{ csrf() }}
  <label>Name <input name="name" required value="{{ team.name if team else '' }}"></label>
  <label>Sport <input name="sport" placeholder="Football, Basketball..." value="{{ (team.sport or '') if team else '' }}"></label>
  <label>Color <input type="color" name="color" value="{{ team.color if team else '#1e88e5' }}"></label>
  <button class="btn">Save</button>
</form>
{% if team and g.user.is_admin %}
<form method="post" action="{{ url_for('teams.delete', team_id=team.id) }}" class="danger-zone"
      onsubmit="return confirm('Delete this team and all its events?')">
  {{ csrf() }}<button class="btn danger">Delete team</button>
</form>
{% endif %}
{% endblock %}
